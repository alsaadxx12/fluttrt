<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CINEBALL — البث إلى هذه الشاشة</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060A;
    --card: #0D121D;
    --line: rgba(255,255,255,.07);
    --text: #FFFFFF;
    --muted: #94A3B8;
    --faint: #64748B;
    --brand: #E50914;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Arabic', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: grid; place-items: center; overflow: hidden; }

  .wrap { width: min(560px, 92vw); text-align: center; padding: 24px; }

  .brand {
    font-size: 40px; font-weight: 900; letter-spacing: 2px; margin: 0 0 6px;
    direction: ltr;
  }
  .brand span { color: var(--brand); }
  .tagline { color: var(--muted); font-size: 15px; margin: 0 0 30px; }

  .panel {
    background: var(--card); border-radius: 22px; padding: 28px 24px 26px;
  }

  .qr {
    width: 264px; height: 264px; margin: 0 auto 22px; background: #fff;
    border-radius: 16px; padding: 12px; display: grid; place-items: center;
  }
  .qr canvas, .qr img { width: 100%; height: 100%; display: block; }

  .code-label { color: var(--faint); font-size: 13px; margin-bottom: 8px; }
  .code {
    font-size: 44px; font-weight: 900; letter-spacing: 10px; direction: ltr;
    font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }

  .status { margin-top: 20px; color: var(--muted); font-size: 14px; }
  .status.err { color: #FF6B75; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand); margin-inline-end: 8px; vertical-align: 1px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

  button.retry {
    margin-top: 18px; background: var(--brand); color: #fff; border: 0;
    border-radius: 999px; padding: 11px 26px; font: inherit; font-weight: 800;
    cursor: pointer;
  }

  /* ----------------------------------------------------------- player */
  #stage { position: fixed; inset: 0; background: #000; display: none; }
  #stage.on { display: block; }

  /* Stays up until the screen is filled, because the viewer is on a sofa
     and may look over some seconds after the picture starts. */
  #fs-hint {
    position: fixed; top: 22px; inset-inline-start: 50%;
    transform: translateX(50%);
    background: rgba(13,18,29,.92); border: 1px solid var(--line);
    color: var(--text); font: inherit; font-size: 15px; font-weight: 800;
    padding: 12px 24px; border-radius: 999px;
    display: none; align-items: center; gap: 9px; cursor: pointer;
    z-index: 10;
  }
  #stage.on ~ #fs-hint { display: inline-flex; }
  html:fullscreen #fs-hint { display: none !important; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* The subtitle, at a size meant for a sofa rather than a desk. A plain
     shadow rather than a box: a box over a dark scene is a grey slab, and
     over a bright one it is worse. */
  video::cue {
    font-family: 'Noto Sans Arabic', system-ui, sans-serif;
    font-size: 2.4vh; /* scaled by #cue-size, from the phone */
    line-height: 1.4;
    background: transparent;
    color: #FFFFFF;
    text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9);
  }

  #bar {
    position: absolute; inset-inline: 0; bottom: 0; padding: 40px 28px 22px;
    background: linear-gradient(to top, rgba(0,0,0,.88), transparent);
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #stage.show-ui #bar { opacity: 1; pointer-events: auto; }
  #stage.show-ui { cursor: default; }
  #stage { cursor: none; }

  .row { display: flex; align-items: center; gap: 12px; direction: ltr; }
  .time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 52px; }
  .track { flex: 1; height: 4px; background: rgba(255,255,255,.22); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--brand); }
  .live {
    background: var(--brand); color: #fff; font-size: 11px; font-weight: 900;
    padding: 3px 9px; border-radius: 6px; letter-spacing: .5px;
  }

  #toast {
    position: fixed; inset-inline: 0; top: 26px; display: flex; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  #toast.on { opacity: 1; }
  #toast span {
    background: rgba(13,18,29,.95); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
  }
</style>
</head>
<body>

<div class="wrap" id="pairing">
  <h1 class="brand">CINE<span>BALL</span></h1>
  <p class="tagline">امسح الرمز بتطبيق سينبول لتشغيل المحتوى على هذه الشاشة</p>
  <div class="panel">
    <div class="qr" id="qr"></div>
    <div class="code-label">أو أدخل هذا الرمز في التطبيق</div>
    <div class="code" id="code">— — — — — —</div>
  </div>
  <div class="status" id="status"><span class="dot"></span>في انتظار الاتصال…</div>
  <button class="retry" id="retry" hidden>إعادة المحاولة</button>
</div>

<div id="stage">
  <video id="v" playsinline></video>
  <div id="bar">
    <div class="row">
      <span class="time" id="t-now">0:00</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="time" id="t-end">0:00</span>
      <span class="live" id="live" hidden>LIVE</span>
    </div>
  </div>
</div>

<button id="fs-hint" type="button">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E50914"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
  </svg>
  <span>ملء الشاشة</span>
</button>

<div id="toast"><span id="toast-text"></span></div>
<style id="cue-size"></style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  // The project's public anon key — the same one the app ships. It grants
  // nothing beyond the row-level policies in 03_cast_sessions.sql.
  var SUPABASE_URL = 'https://kjpztermkiazjfveqgot.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqcHp0ZXJta2lhempmdmVxZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzQ0MTAsImV4cCI6MjEwNTU1MDQxMH0.fmM6K6ZANmfmZcif6tek6x0S0VPG2R9uz5Zg9MuEPzY';

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { persistSession: false },
  });

  var el = function (id) { return document.getElementById(id); };
  var pairing = el('pairing'), stage = el('stage'), video = el('v');
  var statusEl = el('status'), retryBtn = el('retry');

  var session = null;     // the row we opened
  var channel = null;     // realtime channel for this session
  var hls = null;         // hls.js instance, when one is needed
  var media = null;       // what is loaded: {title, poster, isLive, ...}
  var uiTimer = null, stateTimer = null, beatTimer = null;

  // ------------------------------------------------------------- helpers
  function say(text, isError) {
    statusEl.innerHTML = isError ? '' : '<span class="dot"></span>';
    statusEl.appendChild(document.createTextNode(text));
    statusEl.className = 'status' + (isError ? ' err' : '');
    retryBtn.hidden = !isError;
  }

  function toast(text) {
    el('toast-text').textContent = text;
    el('toast').classList.add('on');
    setTimeout(function () { el('toast').classList.remove('on'); }, 2200);
  }

  function clock(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    var s = Math.floor(seconds % 60), m = Math.floor(seconds / 60) % 60, h = Math.floor(seconds / 3600);
    var mm = (h > 0 && m < 10 ? '0' : '') + m;
    return (h > 0 ? h + ':' : '') + mm + ':' + (s < 10 ? '0' : '') + s;
  }

  function describeBrowser() {
    var ua = navigator.userAgent;
    var os = /Windows/.test(ua) ? 'Windows'
           : /Mac OS X|Macintosh/.test(ua) ? 'Mac'
           : /Linux/.test(ua) ? 'Linux'
           : /Android/.test(ua) ? 'Android' : 'الكمبيوتر';
    var app = /Edg\//.test(ua) ? 'Edge'
            : /OPR\//.test(ua) ? 'Opera'
            : /Chrome\//.test(ua) ? 'Chrome'
            : /Firefox\//.test(ua) ? 'Firefox'
            : /Safari\//.test(ua) ? 'Safari' : 'المتصفح';
    return app + ' — ' + os;
  }

  // ------------------------------------------------------- opening a session
  function openSession() {
    say('جارٍ فتح جلسة…');
    db.rpc('open_cast_session', { name_of_device: describeBrowser() })
      .then(function (res) {
        if (res.error) throw res.error;
        var row = Array.isArray(res.data) ? res.data[0] : res.data;
        if (!row || !row.id) throw new Error('empty session');
        session = { id: row.id, pairing_code: row.pairing_code, status: 'waiting' };
        listen();
        heartbeat();
        say('في انتظار الاتصال…');
        // Drawn last: the session is live either way, and a QR that will not
        // render must not look like a failure to open one.
        showCode(session.pairing_code);
      })
      .catch(function (e) {
        say('تعذّر فتح جلسة البث — تحقّق من اتصالك بالإنترنت', true);
        console.error('[cast] open failed', e);
      });
  }

  function showCode(code) {
    el('code').textContent = code.split('').join(' ');
    // Six digits and nothing else. It used to carry a json object with the
    // session uuid inside, sixty-odd characters, and the resulting grid was
    // too fine for a phone to resolve off a lit screen. The uuid was never
    // needed here: the app pairs with the code and the claim hands the
    // session back. Fewer characters, bigger modules, reads from a sofa.
    //
    // Nothing else belongs in it either — no stream url, no token, nothing
    // that plays anything on its own.
    var box = el('qr');
    box.innerHTML = '';
    try {
      new window.QRCode(box, {
        text: code,
        width: 240,
        height: 240,
        // The highest correction level: a quarter of the square can be lost
        // to glare or a bad angle and it still reads.
        correctLevel: window.QRCode.CorrectLevel.H,
      });
    } catch (e) {
      // The code below the square is enough to pair with; a QR that will
      // not draw must not take the session down with it.
      console.error('[cast] qr', e);
      box.innerHTML = '<div style="color:#64748B;font-size:12px;padding:8px">'
        + 'أدخل الرمز يدوياً</div>';
    }
  }

  // ------------------------------------------------------------- realtime
  function listen() {
    channel = db.channel('cast:' + session.id, { config: { broadcast: { self: false } } });

    channel.on('broadcast', { event: 'command' }, function (msg) {
      handle((msg && msg.payload) || {});
    });

    // The phone says so itself once its claim goes through: the session row
    // is closed to this page, so there is nothing to watch for.
    channel.on('broadcast', { event: 'paired' }, function (msg) {
      if (session.status !== 'waiting') return;
      session.status = 'paired';
      var name = (msg.payload && msg.payload.phone) || '';
      say('تم الاتصال');
      toast(name ? 'تم الربط بـ ' + name : 'تم ربط الهاتف');
    });

    channel.subscribe(function (state) {
      if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT') {
        say('انقطع الاتصال بالخادم — جارٍ إعادة المحاولة…', false);
      }
    });
  }

  function report(extra) {
    if (!channel || !media) return;
    var payload = {
      type: 'STATE',
      position: video.currentTime || 0,
      duration: isFinite(video.duration) ? video.duration : null,
      paused: video.paused,
      muted: video.muted,
      volume: video.volume,
      ended: video.ended,
      isLive: !!media.isLive,
    };
    if (extra) for (var k in extra) payload[k] = extra[k];
    channel.send({ type: 'broadcast', event: 'state', payload: payload });
  }

  function heartbeat() {
    clearInterval(beatTimer);
    beatTimer = setInterval(function () {
      if (!session) return;
      db.rpc('touch_cast_session', { session_id: session.id }).then(function () {}, function () {});
    }, 60000);
  }

  // ------------------------------------------------------- subtitle size
  // The phone says how big the words should be, as a multiple of the
  // 2.4vh above. ::cue takes a stylesheet and nothing else - no class, no
  // inline style - so the rule is rewritten. Kept in this browser for the
  // next film, and sent again with every film anyway.
  function setSubtitleScale(scale) {
    var s = Number(scale);
    if (!isFinite(s) || s <= 0) s = 1;
    document.getElementById('cue-size').textContent =
      'video::cue { font-size: ' + (2.4 * s).toFixed(2) + 'vh; }';
    try { localStorage.setItem('cast_subtitle_scale', String(s)); } catch (e) {}
  }
  try { setSubtitleScale(localStorage.getItem('cast_subtitle_scale') || 1); } catch (e) {}

  // --------------------------------------------------------------- commands
  function handle(cmd) {
    switch (cmd.type) {
      case 'LOAD_MEDIA':
      case 'CHANGE_MEDIA':
        return load(cmd);
      case 'SUBTITLE_SIZE':
        setSubtitleScale(cmd.scale);
        return;
      case 'PLAY':   return video.play().catch(function () {});
      case 'PAUSE':  return video.pause();
      case 'SEEK':
        if (media && media.isLive) return;
        if (typeof cmd.position === 'number') video.currentTime = cmd.position;
        return;
      case 'VOLUME':
        if (typeof cmd.value === 'number') video.volume = Math.max(0, Math.min(1, cmd.value));
        return report();
      case 'MUTE':   video.muted = true; return report();
      case 'UNMUTE': video.muted = false; return report();
      case 'SUBTITLE':   return pickTrack('text', cmd.index);
      case 'AUDIO_TRACK': return pickTrack('audio', cmd.index);
      case 'STOP':   return teardown('تم إيقاف البث من الهاتف');
      case 'PING':   return report({ type: 'PONG' });
      default: return;
    }
  }

  function pickTrack(kind, index) {
    if (kind === 'text') {
      var tracks = video.textTracks || [];
      for (var i = 0; i < tracks.length; i++) {
        tracks[i].mode = (i === index) ? 'showing' : 'disabled';
      }
      return;
    }
    if (hls && hls.audioTracks && hls.audioTracks.length > index) hls.audioTrack = index;
  }

  // ------------------------------------------------------------ subtitles
  // The catalogue serves SubRip, and a <track> element reads WebVTT and
  // nothing else — an .srt attached directly is fetched, parsed, found
  // wanting and dropped without a word, which is exactly how this looked
  // from the sofa. So it is fetched here and rewritten before the browser
  // ever sees it.
  //
  // The two formats differ in three details: the header line, a comma
  // before the milliseconds, and SubRip's habit of counting from 0 where
  // WebVTT wants two digits of hours.
  function srtToVtt(text) {
    var body = text
      .replace(/\r\n|\r/g, '\n')
      .replace(/^﻿/, '')
      // SubStation override tags — {\an8} and its relatives — say where a
      // line belongs and how it should look. WebVTT has its own way of
      // saying both and no idea what these are, so it prints them as words
      // in the middle of the sentence. Out they go.
      .replace(/\{\\[^}]*\}/g, '')
      .replace(
        /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/g,
        function (_, h, m, sec, ms) {
          return (h.length < 2 ? '0' + h : h) + ':' + m + ':' + sec +
                 '.' + (ms + '00').slice(0, 3);
        }
      );
    return 'WEBVTT\n\n' + body;
  }

  function attachSubtitle(url, label) {
    // Fetched rather than linked: the file has to be rewritten on the way
    // through, and the catalogue's CDN allows the read (it answers with
    // Access-Control-Allow-Origin).
    fetch(url, { credentials: 'omit' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function (text) {
        var vtt = /^\s*WEBVTT/.test(text) ? text : srtToVtt(text);
        var blob = new Blob([vtt], { type: 'text/vtt' });
        var track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = label || 'الترجمة';
        track.srclang = 'ar';
        track.src = URL.createObjectURL(blob);
        track.addEventListener('load', function () {
          // `default` only marks a preference, and browsers honour it
          // unevenly; saying `showing` outright is what puts the words on
          // the screen every time.
          if (!track.track) return;
          track.track.mode = 'showing';
          // Two lines clear of the bottom, so the words are not sitting on
          // the edge of the screen or behind the progress bar. Line is a
          // property of the cue; no stylesheet can reach it.
          var cues = track.track.cues || [];
          for (var i = 0; i < cues.length; i++) cues[i].line = -3;
        });
        video.appendChild(track);
        if (video.textTracks && video.textTracks.length) {
          video.textTracks[video.textTracks.length - 1].mode = 'showing';
        }
      })
      .catch(function (e) {
        // A missing subtitle must never take the picture down with it.
        console.warn('[cast] subtitle', e);
      });
  }

  // ----------------------------------------------------------- full screen
  // The picture is meant to be the whole screen, not a rectangle inside a
  // browser window with an address bar over it. Going full screen is what
  // removes the window, the tab strip and the address of this page along
  // with them.
  //
  // A browser only grants it off the back of a click, so the attempt is
  // made anyway and, when it is refused, the next click anywhere does it.
  function goFullscreen() {
    var root = document.documentElement;
    var request = root.requestFullscreen || root.webkitRequestFullscreen ||
                  root.mozRequestFullScreen || root.msRequestFullscreen;
    if (!request || document.fullscreenElement) return Promise.resolve();
    try {
      var result = request.call(root);
      return result && result.catch ? result : Promise.resolve();
    } catch (e) {
      return Promise.reject(e);
    }
  }

  function enterFullscreen() {
    // Refused without a click, every time — the button below is what
    // actually gets there. Asking anyway costs nothing and works on the
    // rare browser that allows it.
    goFullscreen().catch(function () {});
  }

  // A click on a button is the strongest user activation a browser
  // recognises; a handler on the document was not enough here.
  var fsHint = el('fs-hint');
  if (fsHint) {
    fsHint.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      goFullscreen().catch(function (err) {
        // Reported rather than swallowed: if a browser refuses even this,
        // the reason should be somewhere a person can read it.
        console.warn('[cast] fullscreen refused', err);
        // Some browsers will only hand the screen to the video itself.
        var v = video;
        var alt = v.requestFullscreen || v.webkitRequestFullscreen ||
                  v.webkitEnterFullscreen;
        if (alt) { try { alt.call(v); } catch (e2) { toast('المتصفح رفض ملء الشاشة'); } }
        else toast('المتصفح رفض ملء الشاشة');
      });
    });
  }

  // Double-clicking the picture is what people try first on any player.
  video.addEventListener('dblclick', function () {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else {
      goFullscreen().catch(function () {});
    }
  });

  // ------------------------------------------------------------- playback
  function load(cmd) {
    if (!cmd.url) return;
    media = {
      title: cmd.title || '',
      poster: cmd.poster || '',
      isLive: !!cmd.isLive,
      mediaId: cmd.mediaId || null,
    };

    pairing.style.display = 'none';
    stage.classList.add('on');
    el('live').hidden = !media.isLive;

    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    while (video.firstChild) video.removeChild(video.firstChild);

    var isHls = /\.m3u8(\?|$)/i.test(cmd.url) || cmd.contentType === 'application/x-mpegURL';
    var nativeHls = video.canPlayType('application/vnd.apple.mpegurl') !== '';

    if (isHls && window.Hls && window.Hls.isSupported() && !nativeHls) {
      hls = new window.Hls({ enableWorker: true, lowLatencyMode: !!media.isLive });
      hls.on(window.Hls.Events.ERROR, function (_, data) {
        if (!data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) return hls.startLoad();
        if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) return hls.recoverMediaError();
        fail('تعذّر تشغيل هذا المصدر');
      });
      hls.loadSource(cmd.url);
      hls.attachMedia(video);
    } else {
      video.src = cmd.url;
    }

    if (typeof cmd.subtitleScale === 'number') setSubtitleScale(cmd.subtitleScale);
    if (cmd.subtitleUrl) attachSubtitle(cmd.subtitleUrl, cmd.subtitleLabel);

    video.play().then(function () {
      if (typeof cmd.position === 'number' && cmd.position > 0 && !media.isLive) {
        video.currentTime = cmd.position;
      }
    }).catch(function () {
      // Some browsers refuse sound-on autoplay until the page is touched.
      video.muted = true;
      video.play().catch(function () { fail('المتصفح منع التشغيل التلقائي — انقر الصفحة'); });
    });

    db.rpc('report_cast_session', {
      session_id: session.id,
      new_status: 'playing',
      title: media.title,
      poster: media.poster,
      media: media.mediaId,
      live: media.isLive,
    }).then(function () {}, function () {});

    enterFullscreen();
    flashUi();
    report();
  }

  function fail(text) {
    toast(text);
    report({ type: 'ERROR', message: text });
  }

  function teardown(text) {
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    media = null;
    stage.classList.remove('on');
    pairing.style.display = '';
    say(text || 'انتهى البث');
    if (session) {
      db.rpc('report_cast_session', { session_id: session.id, new_status: 'paired' })
        .then(function () {}, function () {});
    }
  }

  // ------------------------------------------------------------------ ui
  function flashUi() {
    stage.classList.add('show-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(function () { stage.classList.remove('show-ui'); }, 3000);
  }

  document.addEventListener('mousemove', flashUi);
  stage.addEventListener('dblclick', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function () {});
  });

  video.addEventListener('timeupdate', function () {
    var d = isFinite(video.duration) ? video.duration : 0;
    el('t-now').textContent = clock(video.currentTime);
    el('t-end').textContent = media && media.isLive ? '' : clock(d);
    el('fill').style.width = d > 0 ? (video.currentTime / d * 100) + '%' : '0';
  });
  video.addEventListener('play', function () { report(); });
  video.addEventListener('pause', function () { report(); });
  video.addEventListener('ended', function () { report({ type: 'MEDIA_ENDED' }); });

  // State goes back to the phone on a steady beat while something plays, so
  // the remote's clock tracks the picture without a request per frame.
  stateTimer = setInterval(function () { if (media && !video.paused) report(); }, 2000);

  retryBtn.addEventListener('click', function () { retryBtn.hidden = true; openSession(); });

  window.addEventListener('beforeunload', function () {
    if (!session) return;
    db.rpc('end_cast_session', { session_id: session.id });
  });

  openSession();
})();
</script>
</body>
</html>
