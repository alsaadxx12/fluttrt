# Builds the iPhone app in the cloud, on a Mac that Codemagic provides.
#
# Windows cannot build for iOS at all, and this project has no Mac. Codemagic
# (codemagic.io) runs the build on its own Mac machines: connect this
# repository there, add an App Store Connect API key under Teams → Integrations
# (that needs the Apple Developer account, 99 $/year), and start the
# `ios-testflight` workflow. The build lands in TestFlight, from where a link
# installs it on any iPhone — the closest thing to the APK link on Android.
#
# Without the Apple account, `ios-unsigned` proves the app compiles for
# iPhone and produces a Runner.app, but nothing can install that on a phone.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: cineball   # the API key's name in Codemagic → Teams → Integrations
    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.antigravity.yt.cineball
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build the ipa
        script: |
          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//') \
            --build-number=$(grep '^version:' pubspec.yaml | sed 's/.*+//') \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-unsigned:
    name: iOS compile check (no signing)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Build without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
