name: youtube_downloader
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.170+176
environment:
  sdk: ^3.5.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.11.1
  youtube_explode_dart: ^3.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_macos_video: ^1.0.11
  # libmpv for Android: the reels play a video-only stream (up to 1440p)
  # with a separate audio track, which ExoPlayer cannot pair.
  media_kit_libs_android_video: ^1.3.6
  # Registers media_kit as video_player's backend on Windows, where
  # video_player has no implementation of its own and films never started.
  video_player_media_kit: ^2.0.0
  window_manager: 0.4.3
  youtube_player_iframe: ^5.2.1
  webview_windows: ^0.4.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.5
  wakelock_plus: ^1.4.0
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  # The system share sheet for a reel's link.
  share_plus: ^10.0.0
  # Fetches a short's portrait thumbnail for the letterbox check (mockable
  # in tests, unlike dart:io's HttpClient).
  http: ^1.2.0
  # Decodes that thumbnail (pure Dart) so its black bands can be measured.
  image: ^4.2.0
  supabase_flutter: ^2.15.4
  mobile_scanner: 5.2.3
  # Pinned, not a range: 1.0.3 and up call Color.withValues and
  # toARGB32, which arrived in Flutter 3.27 — this project builds on
  # 3.24 and the compile fails outright. 1.0.2 is the last version
  # without them, and it carries no widgets, so no GetX either.
  flutter_chrome_cast: 1.0.2
  permission_handler: ^12.0.3
  lottie: ^3.2.0
  media_kit_libs_ios_video: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs checks on a real device or desktop, with native plugins loaded:
  # the only way to prove a film actually plays on Windows.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/config/
    - assets/animations/
    # The bundled font's licence, shown on the app's own licences page. Named
    # file by file: listing the folder would bundle the .ttf files a second
    # time, once as assets and again as fonts.
    - assets/fonts/OFL.txt

  # Noto Sans Arabic, bundled rather than fetched.
  #
  # google_fonts downloaded the family over the network on first launch: the
  # app opened in a fallback face and re-laid out every line of text the
  # moment the real one arrived, on top of competing with the posters for the
  # connection. Bundled, the right face is there in the first frame.
  #
  # Bundling also gives the weights real cuts. The app sets w600-w900 all over
  # the cards; with only the downloaded regular face loaded those were
  # synthesised, which is what made headings look smeared rather than bold.
  # SIL Open Font License 1.1 - see assets/fonts/OFL.txt.
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabic-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSansArabic-Black.ttf
          weight: 900

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
